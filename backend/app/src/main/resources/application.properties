#Fri Jan 23 13:25:35 CET 2026
micronaut.application.name=blog
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret="${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}"'
# make swagger-ui public by default
micronaut.security.intercept-url-map[0].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[0].httpMethod=GET
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
jpa.default.reactive=true
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.show_sql=true
jpa.default.properties.hibernate.connection.url=${DB_HOST:jdbc:postgresql://localhost:5432/shop}
jpa.default.properties.hibernate.connection.username=${DB_NAME:postgres}
jpa.default.properties.hibernate.connection.password=${DB_PASSWORD:postgres}
jpa.default.entity-scan.packages=com.github.jmlb23.shop.product.infra
